# Dev server block, ported from vagrant/provision/once-as-root.sh.
server {
    listen 80;
    server_name localhost;
    root /app/public;
    client_max_body_size 100M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Lets BinaryFileResponse::trustXSendfileTypeHeader() hand the body to nginx
        # instead of streaming it through PHP. Same path the controller sets manually.
        fastcgi_param HTTP_X_SENDFILE_TYPE X-Accel-Redirect;
        fastcgi_param HTTP_X_ACCEL_MAPPING /app/storage/=/protected-files/;
        fastcgi_read_timeout 600;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Target of X-Accel-Redirect: files and thumbnails under the storage directory.
    location /protected-files/ {
        internal;
        alias /app/storage/;
    }

    error_log  /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}

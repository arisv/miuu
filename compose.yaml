name: miuu

x-app: &app
  build:
    context: ./docker/php
  image: miuu-php:dev
  # Rootful Docker on this host: container uid maps 1:1 to the host user, so bind-mounted
  # files (storage/, var/) stay owned by you. Override with APP_UID/APP_GID if not 1000.
  user: "${APP_UID:-1000}:${APP_GID:-1000}"
  working_dir: /app
  volumes:
    - ./:/app
    - composer-cache:/tmp/composer
  security_opt:
    - label=disable   # SELinux is Enforcing; alternative is ./:/app:z (relabels the whole tree)
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    APP_ENV: dev
    APP_DEBUG: "1"
    SF_VAGRANT_MODE: "0"
    STORAGE_DIR: storage
    DATABASE_URL: "mysql://root:root@db:3306/miubase?serverVersion=mariadb-10.5.29&charset=utf8mb4"
    MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
    COMPOSER_HOME: /tmp/composer
    XDEBUG_MODE: "${XDEBUG_MODE:-debug}"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mariadb:10.5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: miubase
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  php:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - label=disable
    depends_on:
      php:
        condition: service_healthy

  # Optional: thumbnails for files uploaded through the UI or ShareX.
  # docker compose --profile worker up -d worker
  worker:
    <<: *app
    profiles: [worker]
    command: ["php", "bin/console", "messenger:consume", "event_bus", "--time-limit=3600", "--limit=100", "-vv"]
    restart: unless-stopped

volumes:
  db-data:
  composer-cache:
